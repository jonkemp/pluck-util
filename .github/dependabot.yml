version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-patch-and-minor:
        update-types:
          - patch
          - minor
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-patch-and-minor:
        update-types:
          - patch
          - minor
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
